plugins {
    id 'com.android.application'
}

// 版本号自动跟随网页：从 assets/index.html 里读 APP_VERSION，读不到才回落。
// 这样网页升版后不必再手动改这里，避免出现「网页跑 v3.51、应用信息里还是 3.50」的漂移。
def webVer = 'v3.50.5'
try {
    def m = new File(projectDir, 'src/main/assets/index.html').getText('UTF-8') =~ /const APP_VERSION = "(v?[0-9.]+)"/
    if (m.find()) {
        webVer = m.group(1)
    }
} catch (Exception ignored) {
    logger.lifecycle("⚠️ 未能从 assets/index.html 读取 APP_VERSION，版本号回落为 ${webVer}")
}
def verName = webVer.startsWith('v') ? webVer.substring(1) : webVer
logger.lifecycle("APK versionName = ${verName}（来源：assets/index.html）")

android {
    namespace 'com.example.pokeapp'
    compileSdk 34

    // 固定签名（v3.50.6 起）
    // 目的：GitHub Actions 每次都是一台全新虚拟机，默认由 Gradle 临时生成
    // $HOME/.android/debug.keystore，导致每一轮构建的签名都不同 —— 新包装不上去，
    // 只能卸载旧的，而卸载会把 WebView 的 localStorage（也就是孩子的全部进度）一起清掉。
    // 这里把一把固定的自签名钥匙随仓库提交，CI 与本地构建共用，从此可覆盖安装、不丢数据。
    // 说明：这是自用调试签名（与 Android 默认 debug key 同性质），不含任何商店发布密钥；
    // 密码即 Android 工具链沿用十几年的默认值，公开亦无风险。
    signingConfigs {
        fixed {
            storeFile file('../keystore/pokestudy.p12')
            storeType 'PKCS12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'com.example.pokeapp'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName verName
    }

    buildTypes {
        debug {
            // 用固定钥匙替换 AGP 的随机 debug 签名
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
