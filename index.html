function positionBubble(b, w){
  const r = w.getBoundingClientRect();
  const bw = b.offsetWidth || 220, bh = b.offsetHeight || 80, gap = 14;
  const spaceLeft = r.left, spaceRight = window.innerWidth - r.right;
  const spaceUp = r.top, spaceDown = window.innerHeight - r.bottom;
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  let left, top, place;
  if (spaceLeft >= Math.max(bw+gap, spaceRight)) { left = r.left - bw - gap; top = cy - bh/2; place="left"; }
  else if (spaceRight >= bw+gap) { left = r.right + gap; top = cy - bh/2; place="right"; }
  else if (spaceUp >= bh+gap) { left = cx - bw/2; top = r.top - bh - gap; place="up"; }
  else { left = cx - bw/2; top = r.bottom + gap; place="down"; }
  left = Math.max(8, Math.min(left, window.innerWidth - bw - 8));
  top = Math.max(8, Math.min(top, window.innerHeight - bh - 8));
  b.style.left = left+"px"; b.style.top = top+"px";
  b.classList.remove("ptr-left","ptr-right","ptr-up","ptr-down");
  b.classList.add("ptr-"+place);
}

(function initPartnerDrag(){
  const w = $("#partnerWidget"), b = $("#partnerBubble"); let dragging=false, moved=false, sx=0, sy=0, ox=0, oy=0;
  w.addEventListener("pointerdown", e=>{ dragging=true; moved=false; w.style.cursor="grabbing"; sx=e.clientX; sy=e.clientY; const r=w.getBoundingClientRect(); ox=r.left; oy=r.top; w.setPointerCapture(e.pointerId); });
  w.addEventListener("pointermove", e=>{ if(!dragging) return; if(Math.abs(e.clientX-sx)>6||Math.abs(e.clientY-sy)>6) moved=true; let nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy); nx=Math.max(0,Math.min(window.innerWidth-96,nx)); ny=Math.max(0,Math.min(window.innerHeight-96,ny)); w.style.left=nx+"px"; w.style.top=ny+"px"; w.style.right="auto"; w.style.bottom="auto"; if (b.classList.contains("show")) positionBubble(b, w); });
  w.addEventListener("pointerup", ()=>{ if(!moved && state.partnerId) partnerInteract(); dragging=false; w.style.cursor="grab"; });
})();

/* 检查并解锁成就（发放超级球奖励）——按成就书架逐世代评估，使第一世代成就始终以 gen1 范围为基准 */
function checkAchievements(){
  const a = state.achievements, newly = [];
  ACH_BOOK_ORDER.forEach(gen=>{
    const defs = achDefsForGen(gen);
    const cap = bookCapacity(gen);
    const owned = bookDexCount(gen);
    const byGen = TYPES_BY_GEN[gen] || {};
    const starterIds = STARTERS[gen] || [];
    defs.forEach(d=>{
      const base = d.key.replace(/^gen\d+_/, "");   // 去掉世代前缀，得到基础键（gen1 原本就无前缀）
      let ok = false;
      if (base==="first") ok = owned>=1;
      else if (base==="partner") ok = state.dex.includes(25);            // 最初的伙伴：仅 gen1 含此键
      else if (base==="starters") ok = starterIds.length>0 && starterIds.every(id=>state.dex.includes(id));
      else if (base==="streak7") ok = (gen === state.activeAchBook) && state.allCompleteStreak>=7;  // 坚持不懈只解锁“当前成就书架”对应的世代，避免一连满 7 天把 gen1~gen9 全触发
      else if (base==="mid") ok = owned >= Math.ceil(cap/2);
      else if (base==="high") ok = owned >= Math.ceil(cap*0.9);
      else if (base==="master") ok = isBookComplete(gen);
      else if (base.startsWith("type_")){ const tp=base.slice(5); const ids=byGen[tp]; const th=Math.min(5, ids?ids.length:0); const cnt=ids?ids.filter(id=>state.dex.includes(id)).length:0; ok = cnt>=th; }
      if (ok && !a[d.key]){ a[d.key]=true; state.superBalls += d.reward; newly.push(d); }
    });
  });
  saveState();
  renderBalls();   // 即时刷新顶部超级球数量，无需刷新整页
  if (newly.length){ newly.forEach((d,i)=> setTimeout(()=>celebrateAchievement(d), i*450)); }
}
/* 计算某成就当前进度：返回 {cur,need,label}（以当前成就书架 state.activeAchBook 为基准） */
function achievementProgress(d){
  const gen = state.activeAchBook;
  const cap = bookCapacity(gen);
  const owned = bookDexCount(gen);
  const byGen = TYPES_BY_GEN[gen] || {};
  const starterIds = STARTERS[gen] || [];
  const base = d.key.replace(/^gen\d+_/, "");
  if (base==="first"){ const c=Math.min(owned,1); return {cur:c,need:1,label:"已收集 "+c+"/1"}; }
  if (base==="partner"){ const c=state.dex.includes(25)?1:0; return {cur:c,need:1,label:"皮卡丘 "+c+"/1"}; }
  if (base==="starters"){ const c=starterIds.filter(id=>state.dex.includes(id)).length; return {cur:c,need:starterIds.length,label:"已收集 "+c+"/"+starterIds.length}; }
  if (base==="streak7"){ const c=Math.min(state.allCompleteStreak,7); return {cur:c,need:7,label:"连续全勤 "+c+"/7 天"}; }
  if (base==="mid"){ const need=Math.ceil(cap/2); const c=Math.min(owned,need); return {cur:c,need,label:"已收集 "+c+"/"+need}; }
  if (base==="high"){ const need=Math.ceil(cap*0.9); const c=Math.min(owned,need); return {cur:c,need,label:"已收集 "+c+"/"+need}; }
  if (base==="master"){ const c=Math.min(owned,cap); return {cur:c,need:cap,label:"已收集 "+c+"/"+cap}; }
  if (base.startsWith("type_")){ const tp=base.slice(5); const ids=byGen[tp]||[]; const th=Math.min(5,ids.length); const cnt=ids.filter(id=>state.dex.includes(id)).length; const c=Math.min(cnt,th); return {cur:c,need:th,label:"已收集 "+c+"/"+th}; }
  return {cur:0,need:1,label:""};
}

function doImport(txt){
  try{
    const obj = JSON.parse(txt); if (typeof obj!=="object" || !obj.dex) throw 0;
    const merged = Object.assign(defaultState(), obj);
    // 打卡日历（checkinLog）改为「合并」而非「覆盖」：
    // 以日期为键，保留完成数更大者。这样导入旧备份时不会静默抹掉已有打卡记录。
    if (obj.checkinLog && typeof obj.checkinLog === "object"){
      const cur = (state.checkinLog && typeof state.checkinLog === "object") ? state.checkinLog : {};
      const log = {};
      Object.keys(cur).forEach(k => { if (typeof cur[k] === "number") log[k] = cur[k]; });
      Object.keys(obj.checkinLog).forEach(k => {
        const v = obj.checkinLog[k];
        if (typeof v === "number" && (!(k in log) || v > log[k])) log[k] = v;
      });
      merged.checkinLog = log;
    }
    rebuildCheckinLog(merged);   // 兜底：从 daily.done 反推补全缺失的打卡记录（如旧备份无 checkinLog）
    normalizeState(merged);       // 兼容老用户：导入旧备份时同样补记 activeBook / 已集齐世代等
    state = merged; saveState();
    checkDailyReset();           // 导入后立刻判断跨天：若备份是过去的日期，则把「今日任务」重置为未做（打卡日历不受影响）
    renderHeader(); renderTasks(); renderDex(); closeDialog(); toast("进度导入成功！（打卡日历已合并，历史记录不会丢失）");
  }catch(err){ toast("导入失败：内容无效"); }
}

function renderCalendar(){
  const { y, m } = calView;
  const startW = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const today = new Date();
  const todayKey = todayStr();
  const head = ["日","一","二","三","四","五","六"].map(w=>`<div class="cal-cell head">${w}</div>`).join("");
  let cells = "";
  for (let i=0;i<startW;i++) cells += `<div class="cal-cell empty"></div>`;
  for (let d=1; d<=daysInMonth; d++){
    const key = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const log = state.checkinLog[key];
    const isToday = key === todayKey;
    const cellDate = new Date(y, m, d);
    const isFuture = cellDate > new Date(today.getFullYear(), today.getMonth(), today.getDate());
    let cls = "cal-cell"; let mark = ""; let title = "当天未完成任务";
    if (isToday) cls += " today";
    if (typeof log === "number"){
      if (log >= TASKS.length){ cls += " done"; mark = "✓"; title = "当天 " + TASKS.length + " 个任务全部完成 🎉"; }
      else if (log > 0){ cls += " part"; mark = String(log); title = `当天完成 ${log} 个任务`; }
    }
    if (isFuture) cls += " future";
    cells += `<div class="${cls}" title="${title}"><span class="cal-d">${d}</span><span class="cal-m">${mark}</span></div>`;
  }
  const monthName = `${y} 年 ${m+1} 月`;
  openDialog(`<h2 style="color:#F58A1F;font-size:28px;margin-bottom:8px">📅 打卡日历</h2>

    <div style="font-size:13px;color:#9b8676;margin-top:6px;text-align:center">🟢 完成全部 ${TASKS.length} 个任务　🟠 完成部分（数字=完成个数）　未来日期不可打卡</div>
    <button class="big-btn" id="calClose" style="margin-top:8px">关闭</button>`);
  $("#calPrev").addEventListener("click", ()=>{ sfx.click(); calView.m--; if (calView.m<0){ calView.m=11; calView.y--; } renderCalendar(); });
  $("#calNext").addEventListener("click", ()=>{ sfx.click(); calView.m++; if (calView.m>11){ calView.m=0; calView.y++; } renderCalendar(); });
  $("#calClose").addEventListener("click", ()=>{ sfx.click(); closeDialog(); });
}

/* ==================== 顶部时钟 ==================== */
function tickClock(){
  const el = document.getElementById("hdrClock");
  if (!el) return;
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  el.textContent = `${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ==================== 启动流程 ==================== */
function welcomeIfNeeded(){
  const t = todayStr();
  if (state.lastVisit !== t){
    state.lastVisit = t; saveState();
    const doneCount = TASKS.filter(x => state.daily.done[x.key]).length;
    openDialog(`<h2 style="color:var(--poke-red)">你好呀，${state.name}！👋</h2>
      <div style="font-size:64px;margin:6px 0">🌿<img src="${spriteUrl(906)}" alt="新叶喵" style="width:92px;height:92px;image-rendering:auto;object-fit:contain;vertical-align:middle">🌿</div>
      <div style="font-size:28px;line-height:1.6">新的一天开始啦！<br>今天有 <b style="color:var(--poke-red)">${TASKS.length-doneCount} 个</b>学习任务等着你，<br>完成任务就能得到精灵球，<br>去收服新的宝可梦吧！</div>
      <button class="big-btn" id="welcomeGo">出发！🚀</button>`, {closable:false});
    $("#welcomeGo").addEventListener("click", ()=>{ sfx.click(); closeDialog(); speak(`${state.name}，${timeHello()}！新的宝可梦冒险开始啦！`); if (state.partnerId) setTimeout(()=>partnerSay(timeGreetingLine()), 600); });
  }
}
setInterval(()=>{ const before=state.daily.date; checkDailyReset(); if(state.daily.date!==before){ renderTasks(); renderHeader(); } }, 60000);

checkDailyReset();
closeDialog();            // 启动即关闭任何残留弹窗：防止 WebView 页面恢复(bfcache)把上次开着的图鉴/弹窗带回来，导致“杀后台重启仍卡住”
renderHeader();
renderTasks();
renderDex();
applyTestMode();          // 依据存储的测试模式开关，决定是否显示首页测试按钮条
// 空存档处理：换设备 / 重装 / 打开了新的网址，localStorage 读取不到旧进度时，
// 用一键导入引导替代普通的「每日欢迎」，避免娃/家长误以为"进度被清空"。
if (loadedEmpty){
  // 本地无进度：已登录则从云端恢复；否则弹登录/注册引导（也能在备份里导入本地文件）。
  if (cloudLoggedIn()){
    toast("正在从云端恢复进度…");
    restoreFromCloud().then(ok => { if (!ok) showLoginDialog(); });
  } else {
    showLoginDialog();
  }
} else {
  if (cloudLoggedIn()){
    // 已登录：拉取云端并合并，保证多设备进度互通（修复：已登录设备只推不拉，互相看不到更新）
    restoreFromCloud();
  } else {
    welcomeIfNeeded();
  }
}
tickClock();              // 顶部时钟立即显示一次
setInterval(tickClock, 1000);
startEyeRestTimer();      // 连续使用 20 分钟弹出护眼休息提醒
$("#dateLine").addEventListener("click", openCalendar);   // 点击日期 → 打卡日历

/* 若当前环境无法写入本地存储，提示家长改用 http 方式打开 */
if (!storageWorks()){
  const w = document.getElementById("storageWarn");
  if (w) w.style.display = "block";
}
// 关闭/刷新页面前，把待推送的云端写入尽力发出（best-effort；显式登出由登出按钮 flush）
window.addEventListener("beforeunload", ()=>{
  if (_cloudTimer){ clearTimeout(_cloudTimer); _cloudTimer = null; }
  const _t = getStoredToken(); if (_t) doCloudSave(_t);
});
// 防页面恢复(bfcache)：从缓存还原的页面会带着上次开着的弹窗，这里强制整页刷新，杜绝“杀后台重启仍卡住旧弹窗”
window.addEventListener("pageshow", (e)=>{ if (e.persisted){ window.location.reload(); } });
</script>
</body>
</html>
