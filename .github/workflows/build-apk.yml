name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.memory=2g"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install required SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          echo "=== SDK check ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms/" 2>/dev/null || echo "NO PLATFORMS"
          ls "$ANDROID_HOME/build-tools/" 2>/dev/null || echo "NO BUILD-TOOLS"

      - name: Copy site into app assets
        run: mkdir -p android/app/src/main/assets && cp index.html android/app/src/main/assets/index.html

      - name: Write local.properties for AGP
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build debug APK (Gradle Wrapper)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode all 2>&1

      - name: List build outputs
        run: |
          echo "=== Looking for APK ==="
          find android/app/build -name "*.apk" 2>/dev/null || echo "No APK files found"
          echo "=== Build dir contents ==="
          ls -laR android/app/build/outputs/ 2>/dev/null || echo "No outputs dir"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poke-study-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn
