name: Build APK

# 只跟 master：它是部署分支，双推时必有一次；原先 `on: push:` 无分支限制，
# 推 main + master 会重复构建两份（浪费 runner，且两个 job 抢同一个 release）。
on:
  push:
    branches: [master]
  workflow_dispatch:

# 发布到 Release 需要写权限（内置 GITHUB_TOKEN 默认只读）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.memory=2g"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # v3.49.4 fix：移除 android-actions/setup-android@v3 —— GitHub 强制 Actions 迁移 Node 24 后该 action 在
      # Setup Android SDK 步骤直接崩溃（9/17 起连续构建失败）。ubuntu runner 预装 Android SDK，无需该 action，
      # 直接用 $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 安装所需组件。
      - name: Accept licenses & install required SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
          echo "=== SDK check ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms/" 2>/dev/null || echo "NO PLATFORMS"
          ls "$ANDROID_HOME/build-tools/" 2>/dev/null || echo "NO BUILD-TOOLS"

      - name: Copy site into app assets
        run: mkdir -p android/app/src/main/assets && cp index.html android/app/src/main/assets/index.html

      - name: Write local.properties for AGP
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build debug APK (Gradle Wrapper)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode all 2>&1

      - name: List build outputs
        run: |
          echo "=== Looking for APK ==="
          find android/app/build -name "*.apk" 2>/dev/null || echo "No APK files found"
          echo "=== Build dir contents ==="
          ls -laR android/app/build/outputs/ 2>/dev/null || echo "No outputs dir"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poke-study-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      # ── 发布到 GitHub Release ────────────────────────────────────────────
      # 目的：给 App 内「一键更新」提供一个匿名可下载的固定直链。
      # artifact 下载需要登录 GitHub，WebView 拿不到；Release asset 不需要。
      #
      # 直链（永远指向最新构建）：
      #   https://github.com/baike1203/pokemon-study/releases/latest/download/poke-study.apk
      #
      # 用一个固定 tag `apk-latest`，每次覆盖同名 asset，发布历史不会堆积。
      - name: Prepare release APK
        if: success()
        run: |
          SRC=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$SRC" ]; then echo "❌ 没找到 APK"; exit 1; fi
          cp "$SRC" poke-study.apk
          echo "=== 待发布 ==="
          ls -lh poke-study.apk
          echo "sha256=$(sha256sum poke-study.apk | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "size=$(stat -c%s poke-study.apk)" >> "$GITHUB_ENV"

      - name: Publish to Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 精灵学院 APK（最新构建）
          body: |
            自动构建于 ${{ github.sha }}（${{ github.event.head_commit.message }}）

            - 版本号取自 `assets/index.html` 的 `APP_VERSION`
            - 签名固定（android/keystore/pokestudy.p12），可直接覆盖安装
            - 直链：https://github.com/baike1203/pokemon-study/releases/latest/download/poke-study.apk
          files: poke-study.apk
          overwrite_files: true
          make_latest: true
